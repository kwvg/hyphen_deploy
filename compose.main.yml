# syntax=docker/dockerfile:1

# Mainnet daemon and configuration for Hyphen

networks:
  hy-dash:
    name: hy-dash
    internal: false
  net-db:
    name: net-db
    external: true
  net-api:
    name: net-api
    external: true

services:
  hy-dashd:
    container_name: hy-dashd
    build:
      context: /home/smolt/docker
      dockerfile: Dockerfile.dashd
    mem_limit: 2g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/smolt/data/cluster128k/hy_dashd/dash.conf:/config/dash.conf
      - /srv/cluster128k/hy_dashd:/config
    healthcheck:
      test: ["CMD", "dash-cli", "-datadir=/config", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - hy-dash
    restart: unless-stopped

  # Requires hy-postgresql from the base stack to be running.
  hy-opensearch:
    container_name: hy-opensearch
    image: opensearchproject/opensearch:3
    mem_limit: 2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    environment:
      - TZ=Etc/UTC
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=<TOP-SECRET-IMPORTANT-CREDENTIAL-WHHOO>
    volumes:
      - /home/smolt/data/cluster16k/hy_opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - /srv/cluster16k/hy_opensearch/data:/usr/share/opensearch/data
      - /srv/cluster16k/hy_opensearch/logs:/usr/share/opensearch/logs
    networks:
      - net-db
    restart: unless-stopped

  hy-hyphend:
    container_name: hy-hyphend
    depends_on:
      hy-dashd:
        condition: service_healthy
      hy-opensearch:
        condition: service_started
    build:
      context: /home/smolt/docker
      dockerfile: Dockerfile.hyphend
      additional_contexts:
        src: /home/smolt/src
    mem_limit: 6g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /home/smolt/data/cluster128k/hy_daemon/hyphen.conf:/config/hyphen.conf
      - /srv/cluster128k/hy_daemon:/config
    networks:
      - hy-dash
      - net-db
      - net-api
    restart: unless-stopped
