# syntax=docker/dockerfile:1

# Managed through Portainer, kept here for reference only

networks:
  net-dash:
    internal: false
  net-db:
    internal: true
  net-api:
    internal: true
  net-web:
    internal: false

services:
  postgresql:
    container_name: postgresql
    image: postgres:18-trixie
    mem_limit: 20g
    environment:
      - TZ=Etc/UTC
      - POSTGRES_USER=smolt
      - POSTGRES_PASSWORD=<SUPER-SECRET-PASSWORD-WAHOO-MAR10>
      - POSTGRES_DB=hyphen
    volumes:
      - /srv/cluster8k/hy_postgres:/var/lib/postgresql
    networks:
      - net-db
    restart: unless-stopped
    command: postgres -c max_wal_size=4GB -c full_page_writes=off -c wal_init_zero=off -c wal_recycle=off

  dashd:
    container_name: dashd
    build:
      context: /home/smolt/docker
      dockerfile: Dockerfile.dashd
    mem_limit: 4g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /srv/cluster128k/hy_dashd:/config
    healthcheck:
      test: ["CMD", "dash-cli", "-datadir=/config", "getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - net-dash
    restart: unless-stopped

  opensearch:
    container_name: opensearch
    depends_on:
      postgresql:
        condition: service_started
    image: opensearchproject/opensearch:3
    mem_limit: 4g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    environment:
      - TZ=Etc/UTC
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=<TOP-SECRET-IMPORTANT-CREDENTIAL-WHHOO>
    volumes:
      - /srv/cluster16k/hy_opensearch/config/opensearch.yml:/usr/share/opensearch/config/opensearch.yml
      - /srv/cluster16k/hy_opensearch/data:/usr/share/opensearch/data
      - /srv/cluster16k/hy_opensearch/logs:/usr/share/opensearch/logs
    networks:
      - net-db
    restart: unless-stopped

  hyphend:
    container_name: hyphend
    depends_on:
      dashd:
        condition: service_healthy
      postgresql:
        condition: service_started
      opensearch:
        condition: service_started
    build:
      context: /home/smolt/docker
      dockerfile: Dockerfile.hyphend
      additional_contexts:
        src: /home/smolt/src
    mem_limit: 12g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /srv/cluster128k/hy_daemon:/config
    networks:
      - net-dash
      - net-db
      - net-api
    restart: unless-stopped

  webui:
    container_name: webui
    depends_on:
      - hyphend
    build:
      context: /home/smolt/docker
      dockerfile: Dockerfile.webui
      additional_contexts:
        src: /home/smolt/src
    mem_limit: 4g
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - /srv/cluster128k/hy_nginx/hyphen.conf:/config/nginx/site-confs/default.conf
      - /srv/cluster128k/hy_nginx/include:/config/nginx/include
    ports:
      - 80:80
    networks:
      - net-api
      - net-web
    restart: unless-stopped
