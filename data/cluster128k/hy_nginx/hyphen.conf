# Reverse proxy sits behind Cloudflare in Flexible TLS mode.

include /config/nginx/include/http.conf;

server {
    listen 80;
    listen [::]:80;

    server_name explorer.example.com;

    set $backend "http://hy-hyphend:3080";
    include /config/nginx/include/server.conf;
}

server {
    listen 80;
    listen [::]:80;

    server_name testnet.example.com;

    set $backend "http://ts-hyphend:3080";
    include /config/nginx/include/server.conf;
}

# Reject requests that don't match any known hostname.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    return 444;
}
