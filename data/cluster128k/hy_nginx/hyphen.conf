# Reverse proxy sits behind Cloudflare in Full (Strict) mode.

include /config/nginx/include/http.conf;
include /config/nginx/include/path.conf;

# Mapping to API endpoint
map $host $backend {
    # DNS-proxied
    explorer.example.com    http://hy-hyphend:3080;
    testnet.example.com     http://ts-hyphend:3080;

    # Tunneled
    mainnet.restricted.site http://hy-hyphend:3080;
    testnet.restricted.site http://ts-hyphend:3080;
}

# Mapping to UI configuration
map $host $webui_conf {
    # DNS-proxied
    explorer.example.com    /config/nginx/webui/mainnet.conf;
    testnet.example.com     /config/nginx/webui/testnet.conf;

    # Tunneled
    mainnet.restricted.site /config/nginx/webui/mainnet.conf;
    testnet.restricted.site /config/nginx/webui/testnet.conf;
}

# Tunnel traffic arrives on port 80.
server {
    listen 80;
    listen [::]:80;

    server_name mainnet.restricted.site testnet.restricted.site;

    include /config/nginx/include/server.conf;
}

# DNS-proxied traffic arrives on port 443.
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name explorer.example.com testnet.example.com;

    ssl_certificate     /etc/nginx/ssl/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/$ssl_server_name/privkey.pem;

    include /config/nginx/include/server.conf;
}
