# Shared server-level directives.

access_log /var/log/nginx/access.log json-logger;
error_log  /var/log/nginx/error.log;

# Connection limits.
server_tokens               off;
client_max_body_size         1k;
client_body_timeout         10s;
client_header_timeout       10s;
keepalive_timeout           30s  30s;
send_timeout                10s;
client_header_buffer_size    4k;
large_client_header_buffers  4    8k;

# Security headers.
add_header X-Content-Type-Options        "nosniff"                          always;
add_header X-Frame-Options               "DENY"                             always;
add_header X-DNS-Prefetch-Control        "off"                              always;
add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
add_header Cross-Origin-Resource-Policy  "same-site"                        always;
add_header Cross-Origin-Embedder-Policy  "unsafe-none"                      always;
add_header Cross-Origin-Opener-Policy    "same-origin"                      always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline' static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data:; font-src 'self' fonts.gstatic.com; connect-src 'self' cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;
add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    always;

# Cloudflare handles edge compression.
#gzip on;
#gzip_types text/plain text/css application/json application/javascript
#           text/xml application/xml application/xml+rss text/javascript;

# Block unusual requests.
if ($blocked_agent) {
    return 444;
}

# Block unexpected request methods.
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

# API reverse proxy.
#
# Caching is split into tiers based on how often the data changes.
# Each location sets a local proxy_cache TTL and a Cache-Control header.
#
# Cache-Control uses s-maxage for shared/edge caches (Cloudflare) and
# max-age for the browser. Cloudflare will respect s-maxage when present.
# On cache hits, X-Cache-Status is added for debugging.

# Immutable data due to ChainLocks. Cached for 24 hours locally, 7 days
# at the edge.
location ~ ^/api/v1/(block|rawblock|tx|rawtx)/.+ {
    include /config/nginx/include/proxy.conf;
    proxy_cache            api;
    proxy_cache_valid      200 24h;
    proxy_cache_use_stale  error timeout updating;
    add_header Cache-Control "public, max-age=86400, s-maxage=604800, immutable" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Slow-moving data refreshed every block (~2.5 min). 30-second TTL.
location ~ ^/api/v1/(blocks|txs|address|balances|validators|validator|metrics|proposals|proposal|network)(/|$) {
    include /config/nginx/include/proxy.conf;
    proxy_cache            api;
    proxy_cache_valid      200 30s;
    proxy_cache_use_stale  error timeout updating;
    add_header Cache-Control "public, max-age=15, s-maxage=30" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Mempool: 5-second TTL to absorb bursts.
location ~ ^/api/v1/mempool(/|$) {
    include /config/nginx/include/proxy.conf;
    proxy_cache            api;
    proxy_cache_valid      200 5s;
    proxy_cache_use_stale  error timeout;
    add_header Cache-Control "public, max-age=5, s-maxage=5" always;
    add_header X-Cache-Status $upstream_cache_status always;
}

# Live NDJSON event stream, must not be buffered or cached.
location = /api/v1/stream {
    include /config/nginx/include/proxy.conf;
    proxy_set_header   Connection '';
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-store" always;
}

# Search and status: real-time, not cached.
location ~ ^/api/v1/(search|status)$ {
    include /config/nginx/include/proxy.conf;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
}

# Block public access to API docs.
location /api/docs {
    return 444;
}

# Any other /api/ paths: pass through without caching.
location /api/ {
    include /config/nginx/include/proxy.conf;
    proxy_cache off;
}

# Static frontend.
location / {
    limit_req zone=pages burst=60 nodelay;

    root /config/www;
    try_files $uri $uri/ /200.html;
}

# Drop scanner probes.
location ~ /\.(env|git|svn|htaccess|htpasswd|php|asp|jsp|bak|sql)$ {
    return 444;
}

location ~ /\. {
    return 444;
}

# Block common exploit paths.
location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|cgi-bin) {
    return 444;
}

location = /webui.conf {
    root /config/www;
}

location ~* \.(php|asp|aspx|jsp|cgi|pl|conf|ini|log|sh|toml|yaml|yml)$ {
    return 444;
}
