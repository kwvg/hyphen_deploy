# Shared path directives

# Permit ACME challenges over HTTP, prohibit everything else.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 444; }
}

# Reject TLS connections that don't match any known hostname.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_reject_handshake on;
    return 444;
}
