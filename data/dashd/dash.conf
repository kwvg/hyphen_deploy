server=1
txindex=1
rest=1
disablewallet=1
dbcache=512

# JSON-RPC, accessible to hyphend through the net-dash network.
# Credentials must match [core.rpc] in hyphen.conf.
rpcuser=hyphen
rpcpassword=<SUPER-SECRET-PASSWORD-TOP-SNEAKY>
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcthreads=4
rpcworkqueue=1000

# ZMQ publishers; topics must match [core.zmq] in hyphen.conf.
zmqpubrawtx=tcp://0.0.0.0:28332
zmqpubsequence=tcp://0.0.0.0:28332
zmqpubrawtxlock=tcp://0.0.0.0:28332
zmqpubrawchainlock=tcp://0.0.0.0:28332
zmqpubrawgovernanceobject=tcp://0.0.0.0:28332
zmqpubrawgovernancevote=tcp://0.0.0.0:28332
