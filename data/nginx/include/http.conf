# Shared http-level directives.

# Per-IP rate limiting (using real client IP from Cloudflare).
# The iptables firewall already ensures only CF can reach 80/443, so we trust CF-Connecting-IP.
map $http_cf_connecting_ip $real_client {
    default        $http_cf_connecting_ip;
    ""             $binary_remote_addr;
}
limit_req_zone $real_client zone=pages:10m rate=30r/s;
limit_req_status 429;

# Drop connections from known scanner user agents.
map $http_user_agent $blocked_agent {
    default           0;
    ~*wpscan          1;
    ~*dirbuster       1;
    ~*gobuster        1;
    ~*nikto           1;
    ~*sqlmap          1;
    ~*nmap            1;
    ~*masscan         1;
    ~*zgrab           1;
    ~*nuclei          1;
    ~*httprobe        1;
    ~*subfinder       1;
    ~*httpx           1;
    ~*censys          1;
    ~*shodan          1;
    ~*netcraft        1;
    ~*semrush         1;
    ~*python-requests 1;
    ""                1;
}

# Structured JSON access log.
log_format json-logger escape=json '{'
    '"type":"access-log",'
    '"time":"$time_iso8601",'
    '"remote_ip":"$http_cf_connecting_ip",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"request_id":"$request_id",'
    '"status":$status,'
    '"method":"$request_method",'
    '"host":"$host",'
    '"path":"$uri",'
    '"query":"$args",'
    '"protocol":"$server_protocol",'
    '"request_length":$request_length,'
    '"response_bytes":$body_bytes_sent,'
    '"duration":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent"'
    '}';
