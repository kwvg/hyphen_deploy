# Shared server-level directives.

access_log /var/log/nginx/access.log json-logger;
error_log  /var/log/nginx/error.log;

# Connection limits.
server_tokens               off;
client_max_body_size         1k;
client_body_timeout         10s;
client_header_timeout       10s;
keepalive_timeout           30s  30s;
send_timeout                10s;
large_client_header_buffers 2    1k;

# Security headers.
add_header X-Content-Type-Options        "nosniff"                          always;
add_header X-Frame-Options               "DENY"                             always;
add_header X-DNS-Prefetch-Control        "off"                              always;
add_header Referrer-Policy               "strict-origin-when-cross-origin"  always;
add_header Cross-Origin-Resource-Policy  "same-site"                        always;
add_header Cross-Origin-Embedder-Policy  "unsafe-none"                      always;
add_header Cross-Origin-Opener-Policy    "same-origin"                      always;
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline' static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com; img-src 'self' data:; font-src 'self' fonts.gstatic.com; connect-src 'self' cloudflareinsights.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;
add_header Permissions-Policy
    "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    always;

# Cloudflare handles edge compression.
#gzip on;
#gzip_types text/plain text/css application/json application/javascript
#           text/xml application/xml application/xml+rss text/javascript;

# Block unusual requests.
if ($blocked_agent) {
    return 444;
}

# Block unexpected request methods.
if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
    return 405;
}

# API reverse proxy.
location /api/docs {
    return 444;
}

location /api/ {
    proxy_pass         http://hyphend:3080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header   X-Forwarded-For   $http_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;

    proxy_hide_header  Server;
    proxy_hide_header  X-Powered-By;

    # Required for SSE streaming; disables response buffering so events reach the client without delay.
    proxy_set_header   Connection        '';
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3600s;

    add_header Access-Control-Allow-Origin  "https://$host"      always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type"       always;

    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin  "https://$host";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Access-Control-Max-Age        86400;
        add_header Content-Length                0;
        return 204;
    }
}

# Static frontend.
location / {
    limit_req zone=pages burst=60 nodelay;

    root /config/www;
    try_files $uri $uri/ /200.html;
}

# Drop scanner probes.
location ~ /\.(env|git|svn|htaccess|htpasswd|php|asp|jsp|bak|sql)$ {
    return 444;
}

location ~ /\. {
    return 444;
}

# Block common exploit paths.
location ~* /(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|cgi-bin) {
    return 444;
}

location ~* \.(php|asp|aspx|jsp|cgi|pl|conf|ini|log|sh|toml|yaml|yml)$ {
    return 444;
}
