# Container hostnames (dashd, postgres) resolve through Docker DNS.
# Credentials must match those in dash.conf.

[core]
url              = "http://dashd:9998"
rest_concurrency = 8

[core.rpc]
enabled  = true
url      = "http://dashd:9998"
username = "hyphen"
password = "<SUPER-SECRET-PASSWORD-TOP-SNEAKY>"

timeout_secs            = 10
network_refresh_secs    = 15
governance_refresh_secs = 60
chainlock_refresh_secs  = 5
protx_refresh_secs      = 30

[core.zmq]
enabled   = true
connect   = ["tcp://dashd:28332"]
subscribe = [
  "raw_tx",
  "sequence",
  "raw_tx_lock",
  "raw_chain_lock",
  "raw_governance_object",
  "raw_governance_vote",
]

[postgres]
url                   = "postgresql://smolt:<SUPER-SECRET-PASSWORD-WAHOO-MAR10>@postgresql:5432/hyphen"
write_pool_size       = 32
query_pool_size       = 16
heavy_query_pool_size = 8
admin_pool_size       = 4
slow_query_ms         = 500

[api]
bind = "0.0.0.0:3080"

[indices]
address   = true
validator = true
metrics   = true

[rocksdb]
write_buffer_size_mb = 256
max_background_jobs  = 8
max_open_files       = 8192

[performance]
ingestion_batch_size      = 1024
max_ingestion_lead_blocks = 2048
prefetch_blocks           = 256

[live]
enable_mempool        = true
enable_islock         = true
enable_chainlock      = true
chainlock_start_block = 1088640
enable_governance     = true
enable_network        = true
enable_stream         = true
recent_mempool_txs    = 1000
stream_client_buffer  = 1024
stream_heartbeat_secs = 15

[overlays]
enable_protx     = true
enable_chainlock = true

[cache]
enabled = true

[cache.address]
enabled = true
budget  = "8G"

[cache.readiness]
enabled = true
budget  = "16K"
